# Configuration nginx du site AzuuCine (conteneur azuucine-web).
# Livrée avec chaque release (copiée par deploy/release.sh) et lue via /srv/azuucine/current/nginx/site.conf :
# la configuration vit donc dans le dépôt, et un conteneur recréé la récupère au premier déploiement.
# Les en-têtes de sécurité (security-headers.conf, locations.conf) sont, eux, générés depuis dist/_headers.
server {
    listen 80 default_server;
    server_name azuucine.rdacet.fr _;
    server_tokens off;

    root /srv/azuucine/current/dist;
    index index.html;

    # Adresse inconnue : vraie réponse 404 avec une page dédiée
    error_page 404 /404.html;

    # nginx ne connaît pas .webmanifest : sans cette ligne, le manifest du PWA est servi en octet-stream
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    # Règles par chemin issues de _headers (ex. /sw.js -> no-cache)
    include /srv/azuucine/current/nginx/locations.conf;

    # Fichiers hashés : cache immuable
    location /assets/ {
        include /srv/azuucine/current/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /srv/azuucine/current/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
