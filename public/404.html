<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AzuuCine — Page introuvable</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0a0a0a; color: #e8e8e8; font: 16px/1.6 Inter, system-ui, -apple-system, sans-serif; text-align: center; }
  main { padding: 48px 20px; max-width: 520px; }
  .code { font-size: clamp(6rem, 28vw, 11rem); font-weight: 800; letter-spacing: -.06em; line-height: 1; margin: 0; color: #2a2a2a; }
  .code span { color: #e5383b; }
  h1 { font-size: 1.5rem; margin: 20px 0 8px; }
  p { color: #a3a3a3; margin: 0 0 28px; }
  a.btn { display: inline-block; background: #e5383b; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 999px; }
  a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .en { margin-top: 36px; font-size: .85rem; color: #8a8a8a; }
  .en a { color: #e5383b; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">4<span>0</span>4</p>
  <h1>Cette scène a été coupée au montage</h1>
  <p>La page que tu cherches n'existe pas ou a été déplacée.</p>
  <a class="btn" href="/">Retour à AzuuCine</a>
  <p class="en">Page not found — <a href="/">back to AzuuCine</a></p>
</main>
</body>
</html>
